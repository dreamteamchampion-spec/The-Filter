      <div style={{ fontSize: "9px", color: "#555", letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: "6px", display: "flex", justifyContent: "space-between", alignItems: "center", minHeight: "22px" }}>
        <span>{title} {open ? "▴" : "▾"}</span>
        <span style={{ color: "#7ab87a" }}>{confirmedCount}/{allNames.length}</span>
      </div>
      {shown.length === 0 && <div style={{ fontSize: "10.5px", color: "#333" }}>No data yet</div>}
      {shown.map((r, i) => (
        <div key={r.name} style={{ fontSize: "10.5px", color: markerColorFor(r.state), lineHeight: "1.5", padding: "3px 0" }}>
          <div style={{ display: "flex", gap: "5px" }}>
            <span style={{ flexShrink: 0, width: "12px" }}>{markerSymFor(r.state)}</span>
            <span style={{ flexShrink: 0, minWidth: "115px" }}>{r.name}</span>
          </div>
          {r.state !== "no data" && <div style={{ color: "#555", fontSize: "9.5px", marginLeft: "17px" }}>{r.detail}{r.reason ? " — " + r.reason : ""}</div>}
        </div>
      ))}
      {hiddenCount > 0 && !open && (
        <div style={{ fontSize: "10px", color: "#6a6a72", marginTop: "6px", padding: "7px 0 2px", borderTop: "1px solid #1e1e22", textAlign: "center" }}>
          + {hiddenCount} more, tap to expand
        </div>
      )}
      {open && (
        <div style={{ fontSize: "10px", color: "#6a6a72", marginTop: "6px", padding: "7px 0 2px", borderTop: "1px solid #1e1e22", textAlign: "center" }}>
          tap to collapse
        </div>
      )}
    </div>
  );
}

function TwoPanelMarkers({ herMarkers, hisMarkers }) {
  const [openHer, setOpenHer] = useState(false);
  const [openHis, setOpenHis] = useState(false);
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
      <MarkerPanel title="What She's Shown You" allNames={HER_MARKERS} data={herMarkers || {}} open={openHer} setOpen={setOpenHer} />
      <MarkerPanel title="What She'd Accept About You" allNames={HIS_MARKERS} data={hisMarkers || {}} open={openHis} setOpen={setOpenHis} />
    </div>
  );
}

function DedupedColumn({ title, items, icon, bg, border, labelColor, itemColor, emptyLabel }) {
  const [expanded, setExpanded] = useState(false);
  const clean = dedupeList(items);
  const cap = 8;
  const shown = expanded ? clean : clean.slice(0, cap);
  const hiddenCount = clean.length - shown.length;
  return (
    <div style={{ background: bg, border: "1px solid " + border, borderRadius: "6px", padding: "9px" }}>
      <div style={{ fontSize: "9px", color: labelColor, letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: "5px" }}>{title}</div>
      {clean.length ? shown.map((x,i) => <div key={i} style={{ fontSize: "11px", color: itemColor, lineHeight: "1.9" }}>{icon} {x}</div>) : <div style={{ fontSize: "11px", color: "#333" }}>{emptyLabel}</div>}
      {hiddenCount > 0 && (
        <button onClick={() => setExpanded(true)} style={{ background: "none", border: "none", color: "#555", fontSize: "10px", cursor: "pointer", marginTop: "4px", padding: 0, textDecoration: "underline" }}>
          +{hiddenCount} more
        </button>
      )}
    </div>
  );
}

function Card({ card, name, onSent, caseFile, isLatest }) {
  const [copied, setCopied] = useState(null);
  const color = sc(card.stage);
  const investColor = { hooked: "#27AE60", warming: "#E67E22", lukewarm: "#666" }[(card.investment || "").toLowerCase()] || "#666";
  const frameWord = (card.frame || "").split(/[\s—–-]/)[0].toLowerCase();
  const frameColor = { holding: "#27AE60", slipping: "#D4AC0D", broken: "#C0392B" }[frameWord] || "#555";
  const medColor = { text: "#2980B9", phone: "#27AE60", "in person": "#8E44AD" }[(card.medium || "").toLowerCase()] || "#555";

  function copy(t, i) {
    navigator.clipboard.writeText(t);
    setCopied(i);
    setTimeout(() => setCopied(null), 2000);
  }

  const isHardcoreStage = (card.stage || "").startsWith("C");

  // Merge this turn's new her/his marker SIGNALS on top of the persisted
  // case file counts, then derive every state from the merged counts. This
  // is the only place a number is computed — never read from anything the
  // model typed — so the header, the gate box, and the two-panel display
  // are structurally guaranteed to agree with each other.
  const effHerMarkers = { ...(caseFile?.herMarkers || {}) };
  (isLatest ? (card.her_markers || []) : []).forEach(m => {
    if (!m?.name) return;
    const nm = canonicalHardcoreMarker(m.name, HER_MARKERS);
    const prev = effHerMarkers[nm] || { confirmCount: 0, contradictCount: 0, reasons: [] };
    effHerMarkers[nm] = {
      confirmCount: prev.confirmCount + (m.signal === "confirm" ? 1 : 0),
      contradictCount: prev.contradictCount + (m.signal === "contradict" ? 1 : 0),
      reasons: [...(prev.reasons || []), m.reason].filter(Boolean).slice(-3),
    };
  });
  const effHisMarkers = { ...(caseFile?.hisMarkers || {}) };
  (isLatest ? (card.his_markers || []) : []).forEach(m => {
    if (!m?.name) return;
    const nm = canonicalHardcoreMarker(m.name, HIS_MARKERS);
    const prev = effHisMarkers[nm] || { confirmCount: 0, contradictCount: 0, reasons: [] };
    effHisMarkers[nm] = {
      confirmCount: prev.confirmCount + (m.signal === "confirm" ? 1 : 0),
      contradictCount: prev.contradictCount + (m.signal === "contradict" ? 1 : 0),
      reasons: [...(prev.reasons || []), m.reason].filter(Boolean).slice(-3),
    };
  });
  const herConfirmedCount = HER_MARKERS.filter(n => deriveMarkerState(effHerMarkers[n]?.confirmCount, effHerMarkers[n]?.contradictCount).state === "confirmed").length;
  const hisConfirmedCount = HIS_MARKERS.filter(n => deriveMarkerState(effHisMarkers[n]?.confirmCount, effHisMarkers[n]?.contradictCount).state === "confirmed").length;
  const hardcoreConfirmedCount = herConfirmedCount + hisConfirmedCount;
  const disqualifierCount = (caseFile?.disqualifiers?.length || 0) + (isLatest && card.disqualifier_alert && card.disqualifier_alert !== "null" ? 1 : 0);

  // Code-enforced escalation gate for the hardcore stage — same principle as
  // the light-sift override, just checked against the real 80%-of-22 floor
  // computed from actual instance counts instead of anything the model said.
  let effEscalationEligible = card.escalation_eligible;
  let effOverride = card._override;
  if (isHardcoreStage) {
    if (card.escalation_eligible === true && (hardcoreConfirmedCount < HARDCORE_ESCALATION_FLOOR || disqualifierCount > 0)) {
      effEscalationEligible = false;
      effOverride = disqualifierCount > 0
        ? `Model said escalation was open, but ${disqualifierCount} active disqualifier${disqualifierCount > 1 ? "s" : ""} are still flagged. Locked automatically.`
        : `Model said escalation was open, but only ${hardcoreConfirmedCount} of ${HARDCORE_TOTAL} hardcore markers are actually confirmed (3+ net instances each). Locked automatically — needs ${HARDCORE_ESCALATION_FLOOR}+.`;
    }
  }

  const reportedItems = dedupeNear([...(caseFile?.reportedUnverified || []), ...(isLatest ? (card.reported_unverified || []) : [])]);
  const flagSplit = splitFlagsByAge(caseFile);

            {card.replies.map((r,i) => (
              <div key={i} style={{ background: "#141416", border: "1px solid " + (i === 0 ? "#2a3a2a" : "#1e1e22"), borderRadius: "6px", padding: "10px 12px", marginBottom: "6px" }}>
                <div style={{ fontSize: "9px", color: i === 0 ? "#4a8a4a" : "#555", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: "5px" }}>{r.label}</div>
                <div style={{ fontSize: "13px", color: "#e8e6e1", lineHeight: "1.6" }}>{r.text}</div>

                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function renderMD(text) {
  if (!text) return null;
  const lines = text.split("\n");
  return lines.map((line, li) => {
    const parts = line.split(/(\*\*[^*]+\*\*|\*[^*]+\*)/g);
    const rendered = parts.map((p, i) => {
      if (p.startsWith("**") && p.endsWith("**")) return <strong key={i} style={{ color: "#e8e6e1", fontWeight: "600" }}>{p.slice(2,-2)}</strong>;
      if (p.startsWith("*") && p.endsWith("*")) return <em key={i} style={{ color: "#aaa" }}>{p.slice(1,-1)}</em>;
      return <span key={i}>{p}</span>;
    });
    return <div key={li} style={{ minHeight: line.trim() === "" ? "10px" : "auto" }}>{rendered}</div>;
  });
}

function Bubble({ msg, name, onSent, caseFile, isLatest }) {
  const { text, card } = parseMsg(msg.content);
  if (msg.role === "user") {
    const mode = msg.mode || (msg.content.startsWith("[HER]") ? "her" : msg.content.startsWith("[I SENT THIS]") ? "kwasi" : msg.content.startsWith("[MY THOUGHTS]") ? "thoughts" : null);
    const display = msg.content.replace(/^\[(HER|I SENT THIS|MY THOUGHTS)\]:\s*/, "");
    const cfg = mode === "her"
      ? { align: "flex-start", bg: "#1a1a1f", border: "1px solid #26262c", label: "HER", labelColor: "#8a8a92", radius: "14px 14px 14px 3px" }
      : mode === "kwasi"
      ? { align: "flex-end", bg: "#2e100d", border: "1px solid #5a1e1a", label: "SENT ✓", labelColor: "#C0392B", radius: "14px 14px 3px 14px" }
      : mode === "thoughts"
      ? { align: "flex-end", bg: "#171207", border: "1px solid #3a2a0a", label: "💭 MY THOUGHTS", labelColor: "#8a6a2a", radius: "14px 14px 3px 14px" }
      : { align: "flex-end", bg: "#1e1e24", border: "none", label: null, labelColor: "#555", radius: "14px 14px 3px 14px" };
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: cfg.align, marginBottom: "12px" }}>
        {cfg.label && <div style={{ fontSize: "9px", color: cfg.labelColor, letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: "3px" }}>{cfg.label}</div>}
        <div style={{ background: cfg.bg, border: cfg.border, borderRadius: cfg.radius, padding: "10px 14px", maxWidth: "80%", fontSize: "13px", color: "#e8e6e1", lineHeight: "1.6" }}>{display}</div>
      </div>
    );
  }
  return (
    <div style={{ marginBottom: "16px" }}>
      <div style={{ fontSize: "9px", color: "#333", letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: "6px", display: "flex", alignItems: "center", gap: "8px" }}>
        <span>The Filter</span>
        {msg.usage && (
          <span style={{ color: "#3a3a3a", textTransform: "none", letterSpacing: "normal" }} title={msg.usage.input_tokens + " in / " + msg.usage.output_tokens + " out tokens"}>
            · {msg.cost != null ? "$" + msg.cost.toFixed(3) : ""}
          </span>
        )}
      </div>
      {text && <div style={{ fontSize: "13px", color: "#bbb", lineHeight: "1.9", maxWidth: "94%" }}>{renderMD(text)}</div>}
      {card && <Card card={card} name={name} onSent={onSent} caseFile={caseFile} isLatest={isLatest} />}
    </div>
  );
}

function Chat({ prospect, onBack, onStageUpdate, onCaseFileUpdate, onSummaryUpdate }) {
  const [msgs, setMsgs] = useState(() => { try { return JSON.parse(localStorage.getItem("chat-" + prospect.id) || "[]"); } catch { return []; } });
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  // Live text as it streams in, plus the last message set so a turn killed by
  // the screen switching off can be retried with one tap instead of retyped.
  const [streamingText, setStreamingText] = useState("");
  const [retryable, setRetryable] = useState(null);
  const [localStage, setLocalStage] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("chat-" + prospect.id) || "[]");
      const lastAssistant = [...saved].reverse().find(m => m.role === "assistant");
      if (lastAssistant) {
        const m = lastAssistant.content.match(/CARD_START([\s\S]*?)CARD_END/);
        if (m) { const c = JSON.parse(m[1].trim()); if (c.stage) return c.stage; }
      }
    } catch {}
    return prospect.stage || "A1";
  });
  const bottomRef = useRef(null);
  const taRef = useRef(null);

  useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: "smooth" }); }, [msgs, loading]);
  useEffect(() => {
    try {
      localStorage.setItem("chat-" + prospect.id, JSON.stringify(msgs));
    } catch (e) {
      // Quota exceeded or similar — don't let a storage failure take down the whole app.
      // Drop the oldest half of the thread and retry once so the app stays usable.
      console.error("chat storage write failed, trimming:", e);
      try {
        const trimmed = msgs.slice(Math.floor(msgs.length / 2));
        localStorage.setItem("chat-" + prospect.id, JSON.stringify(trimmed));
        setMsgs(trimmed);
      } catch (e2) {
        console.error("chat storage still failing after trim:", e2);
      }
    }
  }, [msgs]);

  const [inputRole, setInputRole] = useState("thoughts");
  const threadCost = msgs.reduce((sum, m) => sum + (m.cost || 0), 0);

  async function send(override, roleOverride) {
    const mode = roleOverride || inputRole;
    const raw = (override !== undefined ? override : input).trim();
    if (!raw || loading) return;
    setInput("");
    if (taRef.current) taRef.current.style.height = "auto";
    const prefix = mode === "her" ? "[HER]: " : mode === "kwasi" ? "[I SENT THIS]: " : "[MY THOUGHTS]: ";
    const newMsgs = [...msgs, { role: "user", content: prefix + raw, mode, ts: Date.now() }];
    setMsgs(newMsgs);
    if (mode === "kwasi") { setInputRole("her"); return; }
    setLoading(true);
    await runAnalysis(newMsgs);
  }

  function sentReply(text) {
    setMsgs(prev => [...prev, { role: "user", content: "[I SENT THIS]: " + text, mode: "kwasi", ts: Date.now() }]);
    setInputRole("her");
  }

  const [retroLoading, setRetroLoading] = useState(false);
  async function runRetrospective() {
    setRetroLoading(true);
    // Real history predates the hardcore blueprint entirely, so there's
    // nothing to replay from old cards — instead, hand the model the actual
    // recent conversation and ask it to backfill her/his marker INSTANCES
    // from what genuinely happened, same guardrails as a live read, just
    // done once in bulk. Capped to the most recent ~25 real exchanges to
    // keep this single call within budget. Uses RETRO_SYSTEM, not the main
    // SYSTEM — no coaching-depth rule competing for tokens. Goes through the
    // same /api/chat proxy as every other call, never the Anthropic API
    // directly, so the real API key stays server-side.
    const real = msgs.filter(m => m.role === "user");
    const windowed = real.length > 25 ? real.slice(-25) : real;
    const transcript = windowed.map(m => m.content).join("\n");
    const userContent = `Stage: ${localStage}. Real recent history (last ${windowed.length} exchanges):\n\n${transcript}`;
    try {
      const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: MAIN_MODEL, system: RETRO_SYSTEM, messages: [{ role: "user", content: userContent }] }) });
      const raw = await res.text();
      let d;
      try { d = JSON.parse(raw); } catch { throw new Error("Server returned non-JSON (HTTP " + res.status + "). First 200 chars: " + raw.slice(0, 200)); }
      if (d.error) throw new Error("API error: " + (typeof d.error === "string" ? d.error : (d.error.message || JSON.stringify(d.error))));
      const rawText = d.content?.map(b => b.text || "").join("") || "";
      if (!rawText) throw new Error("Empty response from API. Raw: " + raw.slice(0, 200));
      let card = null;
      try {
        const cleaned = rawText.trim().replace(/^```json\s*|^```\s*|```\s*$/g, "");
        card = JSON.parse(cleaned);
      } catch { card = null; }
      if (!card) {
        const cutOff = d.stop_reason === "max_tokens" ? " (looks like it got cut off mid-JSON, hit the token cap)" : "";
        setMsgs(prev => [...prev, { role: "assistant", content: "⚠ Retrospective read didn't come back as valid JSON" + cutOff + ". Raw response: " + rawText.slice(0, 300) }]);
      } else {
        card.stage = localStage;
        // Repackage as a normal CARD_START/CARD_END message so it renders
        // through the exact same Bubble/Card pipeline as every live turn —
        // the gate box and two-panel display derive state from the merged
        // counts identically, whether the instances came from a live turn
        // or a backfill.
        const display = `Retrospective read, backfilled from the last ${windowed.length} real exchanges.\nCARD_START${JSON.stringify(card)}CARD_END`;
        setMsgs(prev => [...prev, { role: "assistant", content: display, ts: Date.now() }]);
        onCaseFileUpdate(prospect.id, card, recentHerText(newMsgs));
      }
    } catch (err) {
      setMsgs(prev => [...prev, { role: "assistant", content: "⚠ Retrospective read failed: " + (err.message || "unknown error") }]);
    }
    setRetroLoading(false);
  }

// Does KWASI's message ask for something to send her? Detecting this from his
// input is far more reliable than inferring it from the model's output — if
// the model narrates strategy instead of drafting, the output has no draft in
// it to detect, which is exactly the failure this catches. He knows what he
// asked for; read that, not the reply.
// Call/date prep is a BRIEFING request, not a drafting request. "What should
// I say to her on the phone" trips every draft keyword there is, but tiered
// text messages are the wrong artefact entirely for a live conversation.
function userWantsPrep(msgs) {
  const lastUser = [...(msgs || [])].reverse().find(m => m.role === "user");
  if (!lastUser) return false;
  const t = (lastUser.content || "").toLowerCase();
  if (/^\[her\]/i.test(lastUser.content || "")) return false;
  const prepContext = /\b(call|calling|phone|phoning|ring|ringing|facetime|voice note|date|dinner|drinks|meet|meeting|see her|seeing her|in person)\b/;
  const prepAsk = /\b(what (should|do|could|can) i (say|ask|bring up|talk about|cover)|what (should|could) i (bring|raise)|topics|questions to ask|list of questions|what to (say|ask|talk)|prep|prepare|briefing|angles?)\b/;
  return prepContext.test(t) && prepAsk.test(t);
}

function userWantsDraft(msgs) {
  const lastUser = [...(msgs || [])].reverse().find(m => m.role === "user");
  if (!lastUser) return false;
  const t = (lastUser.content || "").toLowerCase();
  // A pasted message FROM her is an implicit "what do I say back" — that's
  // the core loop of the app, and it always warrants a card.
  if (/^\[her\]/i.test(lastUser.content || "")) return true;
  return [
    /\bdraft\b/, /\breply\b/, /\brespond\b/, /\bresponse\b/,
    /what (should|do) i (say|send|write|reply)/,
    /\b(give|send|write|make|build) me (a|an|the|another|something)\b/,
    /\bask her\b/, /\bquestion (that|to|which)\b/,
    /\bword (this|it)\b/, /\bphrase (this|it)\b/,
    /\bbetter (card|reply|message|version)\b/,
    /\b(a )?(longer|shorter|fuller|tighter) (one|reply|version|message)\b/,
  ].some(r => r.test(t));
}

  async function runAnalysis(newMsgs) {
    // Fold any messages that are about to fall outside the window into the
    // running summary before they disappear from context entirely.
    // A fresh attempt supersedes any pending retry offer.
    setRetryable(null);
    let caseFile = prospect.caseFile || {};
    const summarizedThrough = caseFile.summarizedThrough || 0;
    const aboutToFallOut = newMsgs.length - HISTORY_CAP;
    if (aboutToFallOut > summarizedThrough) {
      const agingMsgs = newMsgs.slice(summarizedThrough, aboutToFallOut);
      if (agingMsgs.length > 0) {
        const updatedSummary = await summarizeAging(prospect.name, caseFile.summary, agingMsgs);
        caseFile = { ...caseFile, summary: updatedSummary, summarizedThrough: aboutToFallOut };
        onSummaryUpdate(prospect.id, updatedSummary, aboutToFallOut);
      }
    }

    // Real exchange count — counts only actual turns between Kwasi and her
    // ([HER] and [I SENT THIS] tagged messages), never the assistant's own
    // coaching replies or Kwasi's private [MY THOUGHTS] notes. Computed here
    // in code so the model never has to (re-)count the raw transcript itself.
    const realExchangeCount = newMsgs.filter(m =>
      m.role === "user" && (m.content.startsWith("[HER]") || m.content.startsWith("[I SENT THIS]"))
    ).length;

    const ctx = `PROSPECT: ${prospect.name}, age ${prospect.age||"?"}, ${prospect.platform||"unknown"}, current stage ${localStage}\nOverview: ${prospect.overview||"none"}\nNotes: ${prospect.notes||"none"}\nReal exchange count so far: ${realExchangeCount}\n---\n\n${caseFileSummary(caseFile, localStage)}`;
    // Cap what actually goes to the API — keep the most recent ~60 messages so
    // long-running threads don't grow the request (and cost) without bound.
    // Full history still lives in localStorage/msgs regardless, and anything
    // older is preserved in the running summary above instead of just dropped.
    const windowed = newMsgs.length > HISTORY_CAP ? newMsgs.slice(-HISTORY_CAP) : newMsgs;
    // Strip every historical assistant turn down to its plain reasoning text —
    // none of the messages in `windowed` at this point are the live turn
    // (the model hasn't replied yet), so it's always safe to strip all of them.
    const apiMsgs = windowed.map((m, i) => {
      let content = m.role === "assistant" ? stripCardForHistory(m.content) : m.content;
      if (i === 0) content = ctx + content;
      return { role: m.role, content };
    });

    try {
      // Streamed, so the coaching text starts appearing in about a second
      // instead of after the entire card has finished generating. See the
      // note in api/chat.js: the model isn't faster, the wait is just no
      // longer dead time staring at a spinner.
      const streamed = await withWakeLock(() => streamAnalysis(apiMsgs, setStreamingText));
      let text = streamed.text;
      let usage = streamed.usage;
      let cost = costFor(MAIN_MODEL, usage);
      setStreamingText("");
      if (streamed.stopReason === "max_tokens") {
        throw new Error("Response got cut off mid-answer (hit the max_tokens cap in api/chat.js). Raise max_tokens there and try again — nothing was lost, just resend.");
      }
      if (!text) throw new Error("Empty response from API.");
      // A stream that ended early and never produced a card is a dropped turn,
      // not a deliberate prose reply. Offer the retry rather than leaving half
      // an answer sitting there looking finished.
      if (streamed.partial && !/CARD_START[\s\S]*?CARD_END/.test(text)) {
        setRetryable(newMsgs);
      }

      // Structural backstop for RULE 1-3 / DRAFTING TRIGGER (card mandatory):
      // don't just trust the prompt to hold every turn — the same class of bug
      // (a prompt-only instruction quietly dropped) has bitten this app before.
      // Card is the exception, not the default — every other reply (opinion
      // questions, discussion, still gathering info, distress) is tagged
      // [NO_CARD_OK] by the prompt above. If neither a card nor that tag shows
      // up, the card was dropped, not intentionally withheld — silently retry
      // once with an explicit correction before this ever reaches Kwasi.
      const hasCard = /CARD_START[\s\S]*?CARD_END/.test(text);
      const markedIntentional = /\[NO_CARD_OK\]/i.test(text);
      // A missing token is NOT evidence a card was dropped. The card is
      // mandatory in exactly two cases (RULE 1: a stage is named; RULE 2:
      // something sendable is given), so the retry only fires when the reply
      // actually looks like one of those two AND has no card. Everything else
      // — opinions, discussion, questions back, still gathering — fails OPEN
      // and renders as prose. The previous version failed CLOSED, which turned
      // every un-tagged prose reply into a forced card on retry.
      const namesStage = /\b(?:A1|A2|A3|C1|C2|C3)\b/.test(text);
      const looksSendable = /Tier\s*[12]\b/i.test(text)
        || /^\s*(?:>|["“])/m.test(text)
        || /\b(?:send (?:her|this|that)|here'?s (?:the|a) (?:draft|reply|message|line)|you could say|try this)\b/i.test(text);
      // Kwasi asking for a draft makes the card mandatory even when the reply
      // contains no draft to detect. This is the case that cost him three
      // turns: he gave context plus "ask her a question that would find out
      // about the markers", the model narrated the strategy back instead of
      // drafting, and an output-only check saw nothing sendable to flag.
      const askedForPrep = userWantsPrep(newMsgs);
      const askedForDraft = !askedForPrep && userWantsDraft(newMsgs);
      const cardWasMandatory = askedForDraft || namesStage || looksSendable;
      if (!hasCard && !markedIntentional && cardWasMandatory) {
        const retryMsgs = [
          ...apiMsgs,
          { role: "assistant", content: text },
          { role: "user", content: "[SYSTEM]: That reply appears to name a stage or give Kwasi something sendable, but carried no CARD_START/CARD_END card and no [NO_CARD_OK] tag. If either RULE 1 or RULE 2 applies, redo this turn now — same read, same wording, with the actual card appended. If neither applies and the card genuinely wasn't needed, redo it identically and end with [NO_CARD_OK] instead. Do not manufacture a card just to satisfy this check." },
        ];
        try {
          const res2 = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: MAIN_MODEL, system: SYSTEM, messages: retryMsgs }) });
          const raw2 = await res2.text();
          const d2 = JSON.parse(raw2);
          const text2 = d2.content?.map(b => b.text || "").join("") || d2.result || "";
          if (text2 && /CARD_START[\s\S]*?CARD_END/.test(text2)) {
            text = text2;
            const usage2 = d2.usage || null;
            if (usage2) {
              usage = usage
                ? { input_tokens: (usage.input_tokens || 0) + (usage2.input_tokens || 0), output_tokens: (usage.output_tokens || 0) + (usage2.output_tokens || 0) }
                : usage2;
              cost = costFor(MAIN_MODEL, usage);
            }
          }
          // If the retry still comes back without a card, fall through and
          // show the original text as-is — better to surface the miss visibly
          // than to loop silently or swallow it.
        } catch { /* retry failed silently — fall through to original text */ }
      }

      // Structural backstop for DISTRESS OVERRIDE, same self-tag + verify
      // pattern as the card check above. This is the fix for the hospital
      // incident: "help him find real words" was landing as direction about
      // a message ("lead with the hospital line, ask if her friend's okay")
      // rather than the message itself. [NO_CARD_OK] alone can't catch this
      // — a DISTRESS reply is SUPPOSED to skip the card, so that tag being
      // present says nothing about whether an actual sendable line exists.
      // [DISTRESS:HER] with neither a quoted line nor an explicit
      // [DISTRESS_NO_LINE] means the same gap happened again — retry once.
      const hasDistressHer = /\[DISTRESS:HER\]/i.test(text);
      const hasDistressNoLine = /\[DISTRESS_NO_LINE\]/i.test(text);
      const hasQuotedLine = /["“][^"”]{6,}["”]/.test(text);
      if (hasDistressHer && !hasDistressNoLine && !hasQuotedLine) {
        const retryMsgs2 = [
          ...apiMsgs,
          { role: "assistant", content: text },
          { role: "user", content: "[SYSTEM]: That reply is tagged [DISTRESS:HER] but doesn't contain an actual line Kwasi could send, just direction about one. Redo this turn now with the real words written out in full, in your own voice, the way you'd actually say it to her. If on reflection silence really is the right call here, redo it explaining why and end with [DISTRESS_NO_LINE] instead of a line." },
        ];
        try {
          const res3 = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: MAIN_MODEL, system: SYSTEM, messages: retryMsgs2 }) });
          const raw3 = await res3.text();
          const d3 = JSON.parse(raw3);
          const text3 = d3.content?.map(b => b.text || "").join("") || d3.result || "";
          if (text3) {
            text = text3;
            const usage3 = d3.usage || null;
            if (usage3) {
              usage = usage
                ? { input_tokens: (usage.input_tokens || 0) + (usage3.input_tokens || 0), output_tokens: (usage.output_tokens || 0) + (usage3.output_tokens || 0) }
                : usage3;
              cost = costFor(MAIN_MODEL, usage);
            }
          }
          // Same philosophy as the card retry: if it still comes back short,
          // show it as-is rather than looping or hiding the miss.
        } catch { /* retry failed silently — fall through to original text */ }
      }

      text = text.replace(/\s*\[(?:NO_CARD_OK|DISTRESS:HER|DISTRESS:HIM|DISTRESS_NO_LINE)\]\s*/gi, " ").trim();

      // Parse and, if needed, correct the card BEFORE persisting the message —
      // never save raw model output and a corrected in-memory state that
      // disagree, or a reload/scrollback re-parse of the saved text would
      // show the model's uncorrected original with no trace of the override.
      let finalText = text;
      const { card } = parseMsg(text);
      if (card && card.stage) {
        // Code-enforced Number Close gate: never trust the model's own stage
        // claim at face value when it's trying to jump from a light-sift
        // stage (A1-A3) into any hardcore stage (C1+). Fix for the original
        // bug where a card escalated to C1 while the marker panel still
        // showed well under the required count — same principle as the
        // escalation_eligible override already in parseMsg/Card, just
        // applied to the stage field itself and baked into the saved text
        // so the correction can never drift from what's displayed later.
        const wasLightSift = !localStage.startsWith("C");
        const attemptedStage = card.stage;
        if (wasLightSift && attemptedStage.startsWith("C")) {
          const confirmedSoFar = Array.from(new Set([
            ...(caseFile.markersConfirmed || []),
            ...((card.markers_confirmed || []).map(canonicalMarker)),
          ])).length;
          // Ella exception: her genuinely unprompted number/meet initiation
          // substitutes for the 20+ exchange floor ONLY — the marker floor
          // below is untouched, and the A3 move is still trusted from the
          // model same as the base gate always has been. Checks both this
          // turn's card and the persisted case file, since the flag is sticky
          // once true (see mergeCaseFile) and a later turn's escalation
          // attempt won't necessarily repeat it.
          const unpromptedClose = card.her_initiated_close === true || caseFile.herInitiatedClose === true;
          const reasons = [];
          if (realExchangeCount < 20 && !unpromptedClose) reasons.push(`only ${realExchangeCount} of the 20+ real exchanges needed`);
          if (confirmedSoFar < 5) reasons.push(`only ${confirmedSoFar} of the 5+ light-sift markers needed`);
          if (reasons.length) {
            card.stage = "A3";
            card._override = `Model tried to move to ${attemptedStage}, but the Number Close gate isn't actually met yet (${reasons.join(" and ")}). Held at A3 automatically.`;
            finalText = text.replace(/CARD_START[\s\S]*?CARD_END/, `CARD_START${JSON.stringify(card)}CARD_END`);
          }
        }
        setLocalStage(card.stage);
        onStageUpdate(prospect.id, card.stage);
      }
      setMsgs(prev => [...prev, { role: "assistant", content: finalText, usage, cost, ts: Date.now() }]);
      // Always update on a hardcore-stage (C1-C3) turn, even if this turn's
      // card logged nothing new — that's what keeps the deterministic angle
      // (computeAngle) recomputing every turn instead of only on turns where
      // the model happened to log fresh evidence.
      const isHardcoreCard = (card?.stage || "").startsWith("C");
      if (card && (isHardcoreCard || card.disqualifier_alert || card.markers_confirmed?.length || card.markers_contradicted?.length || card.her_markers?.length || card.his_markers?.length || card.reported_unverified?.length || card.quirks?.length || card.bids?.length)) {
        onCaseFileUpdate(prospect.id, card, recentHerText(newMsgs));
      }
    } catch (err) {
      const msg = err && err.message ? err.message : "Something went wrong. Try again.";
      // A dropped connection is overwhelmingly the screen-off case, not a real
      // fault. Keep the exact message set so it can be resent on one tap
      // rather than lost — this is what used to force a full retype.
      const looksDropped = /NetworkError|Failed to fetch|network|aborted|load failed/i.test(msg);
      setStreamingText("");
      setRetryable(looksDropped ? newMsgs : null);
      setMsgs(prev => [...prev, { role: "assistant", content: "⚠ " + (looksDropped ? "Connection dropped before the reply finished. This usually means the screen switched off mid-request — nothing was lost, tap Retry." : msg) }]);
    }
    setLoading(false);
  }

  // One-tap resend of the exact message set that failed. Drops the error line
  // first so a retried turn doesn't leave a stale warning sitting above it.
  async function retryLast() {
    if (!retryable || loading) return;
    const toSend = retryable;
    setRetryable(null);
    setMsgs(prev => {
      const last = prev[prev.length - 1];
      return (last && last.role === "assistant" && last.content.startsWith("\u26a0")) ? prev.slice(0, -1) : prev;
    });
    setLoading(true);
    await runAnalysis(toSend);
  }

  const starters = [
    prospect.name + " just messaged me — what should I say?",
    "This is where I'm at with " + prospect.name + " — give me a read",
    "I think I'm at " + localStage + " with " + prospect.name + " — does that sound right?",
    "I'm stuck with " + prospect.name + " — she's gone a bit cold",
  ];

  return (
    <div style={{ display: "flex", flexDirection: "column", position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "#0a0a0c" }}>
      <div style={{ padding: "12px 16px", borderBottom: "1px solid #141416", display: "flex", alignItems: "center", gap: "11px", background: "#0a0a0c", flexShrink: 0, zIndex: 10 }}>
        <button onClick={onBack} style={{ background: "none", border: "none", color: "#555", cursor: "pointer", fontSize: "20px", lineHeight: 1 }}>←</button>
        <div style={{ width: "36px", height: "36px", borderRadius: "50%", background: sc(localStage) + "22", border: "2px solid " + sc(localStage) + "55", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "15px", fontWeight: "700", color: sc(localStage), flexShrink: 0 }}>{prospect.name[0].toUpperCase()}</div>
        <div style={{ flex: 1 }}>
          <div style={{ fontWeight: "700", fontSize: "14px" }}>{prospect.name}</div>
          <div style={{ fontSize: "11px", color: "#444" }}>{[prospect.age, prospect.platform].filter(Boolean).join(" · ")}</div>
          {(() => {
            const cf = prospect.caseFile || {};
            const isHardcore = localStage.startsWith("C");
            // Same deriveMarkerState the gate box and two-panel display use —
            // never a stored .state field — so this header stat can never
            // show a different number than what's underneath it in the card.
            const herConfirmed = HER_MARKERS.filter(n => deriveMarkerState(cf.herMarkers?.[n]?.confirmCount, cf.herMarkers?.[n]?.contradictCount).state === "confirmed").length;
            const hisConfirmed = HIS_MARKERS.filter(n => deriveMarkerState(cf.hisMarkers?.[n]?.confirmCount, cf.hisMarkers?.[n]?.contradictCount).state === "confirmed").length;
            const hardcoreTotal = herConfirmed + hisConfirmed;
            const bits = [];
            if (isHardcore && hardcoreTotal) bits.push(hardcoreTotal + "/" + HARDCORE_TOTAL + " hardcore markers");
            else if (!isHardcore && cf.markersConfirmed?.length) bits.push(cf.markersConfirmed.length + " markers remembered");
            if (cf.disqualifiers?.length) bits.push("⚠ " + cf.disqualifiers.length + " disqualifier flag" + (cf.disqualifiers.length > 1 ? "s" : ""));
            if (!bits.length) return null;
            return <div style={{ fontSize: "9px", color: cf.disqualifiers?.length ? "#C0392B" : "#4a8a4a", marginTop: "2px" }}>{bits.join(" · ")}</div>;
          })()}
        </div>
        <div style={{ background: sc(localStage), borderRadius: "4px", padding: "3px 8px", fontSize: "10px", fontWeight: "700", color: "#fff" }}>{localStage}</div>
        {msgs.length > 0 && <button onClick={() => { if(confirm("Clear history for " + prospect.name + "?")) { setMsgs([]); localStorage.removeItem("chat-" + prospect.id); }}} style={{ background: "none", border: "1px solid #1e1e22", borderRadius: "4px", padding: "3px 8px", color: "#444", fontSize: "10px", cursor: "pointer" }}>Clear</button>}
      </div>
      {localStage.startsWith("C") && !Object.keys(prospect.caseFile?.herMarkers || {}).length && !Object.keys(prospect.caseFile?.hisMarkers || {}).length && (
        <div style={{ padding: "10px 16px", borderBottom: "1px solid #141416", background: "#0a1220", flexShrink: 0, display: "flex", alignItems: "center", gap: "10px", flexWrap: "wrap" }}>
          <div style={{ fontSize: "11px", color: "#7ab0d8", flex: 1, minWidth: "180px" }}>This real history predates the hardcore blueprint — nothing's been read against the 22 yet.</div>
          <button onClick={runRetrospective} disabled={retroLoading} style={{ background: "#2a5a8a", border: "none", borderRadius: "6px", padding: "6px 12px", color: "#fff", fontSize: "11px", fontWeight: "600", cursor: retroLoading ? "not-allowed" : "pointer" }}>{retroLoading ? "Reading..." : "Run retrospective read"}</button>
        </div>
      )}
      {threadCost > 0 && (
        <div style={{ padding: "4px 16px", fontSize: "10px", color: "#3a3a3a", borderBottom: "1px solid #141416", flexShrink: 0 }}>
          Thread cost so far: ${threadCost.toFixed(2)}
        </div>
      )}

      <div className="chat-scroll" style={{ flex: 1, overflowY: "auto", padding: "16px 16px 8px" }}>
        {msgs.length === 0 ? (
          <div style={{ paddingTop: "16px" }}>
            <div style={{ fontSize: "13px", color: "#444", lineHeight: "1.7", marginBottom: "18px" }}>Tell me what's going on with {prospect.name}. Drop in wherever you are.</div>
            {starters.map((s, i) => <button key={i} onClick={() => send(s, "thoughts")} style={{ background: "#141416", border: "1px solid #1e1e22", borderRadius: "8px", padding: "10px 13px", color: "#666", fontSize: "12px", cursor: "pointer", textAlign: "left", lineHeight: "1.5", display: "block", width: "100%", marginBottom: "7px" }}>"{s}"</button>)}
          </div>
        ) : (() => {
          // Only the NEWEST assistant turn may project its own signals on top
          // of the case file. Its markers haven't been merged yet at render
          // time, so the projection is what makes the gate box correct for the
          // turn you're actually looking at. Every older card HAS already been
          // merged — letting it project again made it re-add its own signals
          // to the live total, so scrollback cards read high (this is the
          // header-says-9 / card-says-10 bug).
          let lastAssistantIdx = -1;
          for (let i = msgs.length - 1; i >= 0; i--) {
            if (msgs[i].role === "assistant") { lastAssistantIdx = i; break; }
          }
          return msgs.map((m, i) => (
            <Bubble
              key={i}
              msg={m}
              name={prospect.name}
              onSent={sentReply}
              caseFile={prospect.caseFile}
              isLatest={i === lastAssistantIdx}
            />
          ));
        })()}
        {loading && (
          <div style={{ marginBottom: "16px" }}>
            <div style={{ fontSize: "9px", color: "#333", letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: "6px" }}>The Filter</div>
            {streamingText
              ? <div style={{ fontSize: "13px", color: "#c8c6c1", lineHeight: "1.6", whiteSpace: "pre-wrap" }}>{streamingText.split("CARD_START")[0].trim()}<span style={{ color: "#555" }}>▍</span></div>
              : <div style={{ fontSize: "13px", color: "#444", fontStyle: "italic" }}>Reading the situation...</div>}
          </div>
        )}
        {!loading && retryable && (
          <div style={{ marginBottom: "16px" }}>
            <button onClick={retryLast} style={{ background: "#1a1508", border: "1px solid #4a3a12", borderRadius: "6px", padding: "8px 16px", color: "#d8c084", fontSize: "12px", fontWeight: "600", cursor: "pointer" }}>Retry that turn</button>
          </div>
        )}
        <div ref={bottomRef} />
      </div>

      <div style={{ padding: "10px 12px", borderTop: "1px solid #141416", flexShrink: 0, background: "#0a0a0c" }}>
        <div style={{ display: "flex", gap: "6px", marginBottom: "8px" }}>
          {[["her","Her"],["kwasi","I sent this"],["thoughts","💭 My thoughts"]].map(([m, label]) => (
            <button key={m} onClick={() => setInputRole(m)} style={{ flex: 1, padding: "6px 0", borderRadius: "6px", border: "1px solid " + (inputRole === m ? (m === "her" ? "#3a3a42" : m === "kwasi" ? "#C0392B" : "#8a6a2a") : "#1a1a1d"), background: inputRole === m ? (m === "her" ? "#26262c" : m === "kwasi" ? "#C0392B" : "#3a2a0a") : "#141416", color: inputRole === m ? (m === "thoughts" ? "#c8a860" : "#fff") : "#555", fontSize: "11px", fontWeight: "600", cursor: "pointer" }}>{label}</button>
          ))}
        </div>
        <div style={{ display: "flex", gap: "8px", alignItems: "flex-end" }}>
          <textarea ref={taRef} value={input} onChange={e => { setInput(e.target.value); e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 120) + "px"; }} onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }}} placeholder={inputRole === "her" ? "Paste " + prospect.name + "'s message..." : inputRole === "kwasi" ? "What you actually sent her..." : "Your thoughts, questions, context..."} rows={1} style={{ flex: 1, background: "#141416", border: "1px solid " + (inputRole === "thoughts" ? "#3a2a0a" : "#222"), borderRadius: "10px", padding: "10px 13px", color: "#e8e6e1", fontSize: "13px", outline: "none", resize: "none", lineHeight: "1.5", maxHeight: "120px" }} />

  );
}
