class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("Render crash:", error, info); }
  render() {
    if (this.state.error) {
      return (
        <div style={{ position: "fixed", inset: 0, background: "#0a0a0c", color: "#e8e6e1", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "24px", textAlign: "center", gap: "14px" }}>
          <div style={{ fontSize: "15px", fontWeight: "700" }}>Something crashed</div>
          <div style={{ fontSize: "12px", color: "#888", maxWidth: "320px", lineHeight: "1.6" }}>{this.state.error.message || String(this.state.error)}</div>
          <button onClick={() => { this.setState({ error: null }); window.location.reload(); }} style={{ background: "#C0392B", border: "none", borderRadius: "8px", padding: "10px 18px", color: "#fff", fontSize: "13px", fontWeight: "600", cursor: "pointer" }}>Reload</button>
        </div>
      );
    }
    return this.props.children;
  }
}

// Matches free-text marker phrasing (which may carry a "(msg N)" suffix or
// slightly different wording turn to turn) back to one of the 10 canonical
// MARKERS. Same substring heuristic MarkerGrid already uses for display, now
// also used to dedupe on write so re-confirming the same trait twice doesn't
// create two separate entries.
function canonicalMarker(raw) {
  const t = asText(raw).toLowerCase();
  const hit = MARKERS.find(m => t.includes(m.toLowerCase().slice(0, 8)));
  return hit || asText(raw); // fall back to raw text if it doesn't match a known marker
}

// Mirrors the EIGHT DATES STAGING block in the system prompt — kept here too
// so the app can compute a real angle in code, not just describe one to the
// model and hope it's used. If these ever diverge, the prompt copy is source
// of truth for what the model is told; this is what the app actually acts on.
const EIGHT_DATES_BY_STAGE = {
  C1: ["Trust & Commitment", "Fun & Adventure"],
  C2: ["Conflict", "Work & Money", "Family"],
  C3: ["Growth & Spirituality", "Dreams", "Sex & Intimacy"],
};

// Keyword signatures per Eight Dates topic, used to pick a topic that
// actually FITS the detail rather than one chosen independently of it. This
// is the fix for "Work & Money: initiated genuine hand-holding" — previously
// topic came from a round-robin counter and detail came from the most recent
// unused item, and nothing ever checked the two were related.
const TOPIC_KEYWORDS = {
  "Trust & Commitment": ["trust", "loyal", "honest", "reliab", "commit", "exclusiv", "depend", "promise", "there for", "consistent"],
  "Fun & Adventure": ["holiday", "travel", "trip", "carnival", "festival", "adventure", "spontan", "explore", "night out", "weekend", "fun", "dance", "party", "gig", "concert"],
  "Conflict": ["argu", "disagree", "fell out", "conflict", "row", "tension", "upset", "annoy", "fight", "apolog", "boundar", "stood her ground", "pushed back"],
  "Work & Money": ["work", "job", "career", "shift", "salary", "money", "saving", "spend", "budget", "business", "study", "degree", "promotion", "office", "earn"],
  "Family": ["family", "mum", "mother", "dad", "father", "sister", "brother", "cousin", "niece", "nephew", "godkid", "godchild", "kids", "children", "parent", "aunt", "uncle", "grandm", "grandd"],
  "Growth & Spirituality": ["church", "faith", "god", "belief", "spiritual", "pray", "therapy", "growth", "learn", "value", "purpose", "meaning", "reflect"],
  "Dreams": ["dream", "goal", "future", "ambition", "one day", "hope to", "want to be", "plan to", "someday", "aspir", "five years"],
  "Sex & Intimacy": ["kiss", "touch", "hand", "affection", "intimate", "close", "cuddle", "physical", "attract", "chemistry", "whine"],
};

function scoreTopicAgainstDetail(topic, detail) {
  const kws = TOPIC_KEYWORDS[topic] || [];
  const d = (detail || "").toLowerCase();
  return kws.reduce((n, k) => n + (d.includes(k) ? 1 : 0), 0);
}

// ---------------------------------------------------------------------------
// ACTION QUIRKS
//
// A logged quirk had exactly one destination: computeAngle, which pairs it
// with an Eight Dates topic and produces a TEXT angle. That means a quirk like
// "she's said she prefers a phone call to texting" could only ever come back
// as something to type at her — the pipeline had no way to turn a preference
// about HOW she likes to be contacted into an instruction to contact her that
// way. Content and action are different kinds of fact and need different exits.
//
// CONTENT quirk  -> angle fuel (as before): a thing she likes, a running joke.
// ACTION quirk   -> sets the card's medium and drives `move`: a stated
//                   preference about channel, timing, or ritual.
const ACTION_QUIRK_RULES = [
  { action: "call", medium: "phone", kws: ["prefers a call", "prefer a call", "rather call", "likes being called", "likes to be called", "likes a phone call", "prefers phone", "phone call over", "hates texting", "not a texter", "bad at texting", "rather talk", "prefers talking", "likes hearing", "hear your voice", "voice over text"] },
  { action: "voice note", medium: "text", kws: ["voice note", "voice message", "voicenote", "audio message"] },
  { action: "timing", medium: null, kws: ["before bed", "after her shift", "after work", "on her commute", "lunch break", "morning person", "night owl", "early riser", "up late", "checks her phone", "free after", "quiet time"] },
  { action: "ritual", medium: null, kws: ["every sunday", "every friday", "every week", "always on a", "religiously", "never misses", "her routine", "routine is", "same time every"] },
];

function classifyQuirk(text) {
  const t = (text || "").toLowerCase();
  if (!t) return null;
  for (const rule of ACTION_QUIRK_RULES) {
    if (rule.kws.some(k => t.includes(k))) {
      return { kind: "action", action: rule.action, medium: rule.medium, text: asText(text) };
    }
  }
  return { kind: "content", action: null, medium: null, text: asText(text) };
}

function splitQuirks(quirks) {
  const content = [], action = [];
  (quirks || []).forEach(q => {
    const c = classifyQuirk(q);
    if (!c) return;
    (c.kind === "action" ? action : content).push(c);
  });
  return { content, action };
}

// Whichever medium the action quirks point at, if they agree on one. Returned
// so the card's `medium` can be driven by a real stated preference of hers
// rather than defaulting to text forever.
function preferredMediumFromQuirks(quirks) {
  const { action } = splitQuirks(quirks);
  const mediums = Array.from(new Set(action.map(a => a.medium).filter(Boolean)));
  return mediums.length === 1 ? mediums[0] : null;
}

// ---------------------------------------------------------------------------
// Did last turn's Live Angle actually get used?
//
// Previously `usedAngles` grew every single turn with whatever angle got
// computed, whether or not anything was ever done with it. So each quirk got
// exactly one turn of visibility and was then permanently burnt — including
// on turns where the angle was never in the reply at all. Now an angle is only
// marked used when this turn's output genuinely references it.
const ANGLE_STOPWORDS = new Set(["about","after","and","any","are","around","because","been","being","but","did","does","doing","for","from","had","has","have","her","here","him","his","how","into","its","just","like","more","most","not","now","one","out","over","said","she","some","something","still","than","that","the","their","them","then","there","these","they","this","those","told","too","unprompted","very","was","were","what","when","which","while","who","why","with","would","you","your"]);

function angleKeywords(detail) {
  return (detail || "")
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g, " ")
    .split(/\s+/)
    .filter(w => w.length > 3 && !ANGLE_STOPWORDS.has(w));
}

function angleWasUsed(angle, card) {
  if (!angle || !angle.sourceItem || !card) return false;
  const kws = angleKeywords(angle.sourceItem);
  if (!kws.length) return false;
  const out = [
    asText(card.move),
    asText(card.reasoning),
    ...((card.replies || []).map(r => asText(r && r.text))),
  ].filter(Boolean).join(" ").toLowerCase();
  if (!out) return false;
  const hits = kws.filter(k => out.includes(k)).length;
  // Two distinctive words, or the only distinctive word there is. A single
  // incidental overlap ("work") shouldn't burn an angle.
  return kws.length === 1 ? hits === 1 : hits >= 2;
}

// Deterministic fallback angle generator. This is the fix for "the app keeps
// saying there's no jump-off point" — instead of relying on the model to
// remember to surface something (an instruction that's failed to hold
// several times), this computes a real angle in code from data already
// sitting in the case file, every single C1-C3 turn, whether or not the
// model's own read produces one. Never mutates caseFile — the caller decides
// whether/how to persist which item got used.
// Stage order for cumulative topic lookups — C1 topics stay in scope all the
// way through C3, C2 topics stay in scope through C3, and so on. Without
// this, an already-live prospect in C3 could only ever match a detail
// against Growth & Spirituality / Dreams / Sex & Intimacy, so a Trust &
// Commitment gap from back at C1 would never again get a chance to surface
// through this path — exactly what happened with Rue.
const STAGE_ORDER = ["C1", "C2", "C3"];
function cumulativeTopicsThroughStage(stage) {
  const idx = STAGE_ORDER.indexOf(stage);
  if (idx === -1) return EIGHT_DATES_BY_STAGE[stage] || null;
  return STAGE_ORDER.slice(0, idx + 1).flatMap(s => EIGHT_DATES_BY_STAGE[s] || []);
}

function computeAngle(caseFile, stage) {
  const topics = cumulativeTopicsThroughStage(stage);
  if (!topics) return null; // pre-C1, no staging topics defined yet
  const used = new Set(caseFile?.usedAngles || []);
  // Quirks are already framed as "worth calling back to" when logged, so
  // they're the stronger source — checked first, on their own, not just
  // appended before IOIs in one combined list (that would let an unused IOI
  // silently win since it'd sit later in the combined array).
  // Action quirks are deliberately excluded here. They aren't conversational
  // material — they're instructions about channel/timing — and letting them
  // into this pool both produced nonsense angles ("Fun & Adventure: she
  // prefers a phone call") and silently burnt them as used.
  const contentQuirks = splitQuirks(caseFile?.quirks).content.map(q => q.text);
  const unusedQuirks = contentQuirks.filter(x => !used.has(x));
  const unusedIois = (caseFile?.iois || []).filter(x => !used.has(x));
  const candidates = [...unusedQuirks, ...unusedIois];

  // Pick the (detail, topic) PAIR that actually fits, rather than picking
  // each independently. Most recent items are preferred, so walk newest
  // first and take the first one that genuinely matches a topic live for
  // this stage.
  let best = null;
  for (let i = candidates.length - 1; i >= 0; i--) {
    const detail = candidates[i];
    for (const topic of topics) {
      const score = scoreTopicAgainstDetail(topic, detail);
      if (score > 0 && (!best || score > best.score)) best = { topic, detail, score };
    }
    if (best) break; // first (newest) item with any real topic match wins
  }
  if (best) {
    return { topic: best.topic, detail: best.detail, sourceItem: best.detail, text: `${best.topic}: ${best.detail} — logged, unused. Pull this in.` };
  }

  // Nothing unused matches a topic live for this stage. Rather than force a
  // wrong label onto a real detail, surface the detail with NO topic claim,
  // which is honest and still gives him something concrete to use.
  const orphan = candidates.length ? candidates[candidates.length - 1] : null;
  if (orphan) {
    return { topic: null, detail: orphan, sourceItem: orphan, text: `${orphan} — logged, unused. Pull this in.` };
  }

  // Nothing unused at all — still never leave this empty. Fall back to a
  // stage topic as a real, if generic, prompt rather than silence. Round-robin
  // so a long thread cycles rather than sitting on the first topic forever.
  const topic = topics[(caseFile?.usedAngles?.length || 0) % topics.length];
  return { topic, detail: null, sourceItem: null, text: `${topic}: nothing specific logged yet — still a live topic, ask something real about it.` };
}

// A flag stays "live" for this many analysis turns after it was first seen.
// Past that it becomes historic: still on record, but no longer presented as
// a current read on her, and no longer fed to the model as an active concern.
const FLAG_ACTIVE_TURNS = 6;

function splitFlagsByAge(caseFile) {
  const all = caseFile?.iods || [];
  const ages = caseFile?.iodAges || {};
  const now = caseFile?.turnCount || 0;
  const active = [];
  const historic = [];
  all.forEach(t => {
    const seen = ages[t];
    // null = never stamped, 0 = legacy sentinel (predates age tracking).
    // Both are historic — neither should be presented as a current read.
    if (seen == null || seen === 0 || now - seen >= FLAG_ACTIVE_TURNS) historic.push(t);
    else active.push(t);
  });
  return { active, historic };
}

function mergeCaseFile(existing, card) {
  const cf = {
    disqualifiers: [...(existing.disqualifiers || [])],
    markersConfirmed: [...(existing.markersConfirmed || [])],
    markersContradicted: [...(existing.markersContradicted || [])],
    // IOIs/flags persist here across the whole thread — fixes the bug where
    // they'd thin out or vanish once older messages aged out of the API
    // context window, since previously the model was the only thing holding
    // this list and had no way to recall what had already scrolled away.
    iois: [...(existing.iois || [])],
    // Bids replace IOIs as the live read from C1 onward (see caseFileSummary).
    // Kept as its own list rather than reusing iois, so an A-stage interest
    // signal and a C-stage bid never get silently merged into one column.
    bids: [...(existing.bids || [])],
    iods: [...(existing.iods || [])],
    // Age stamps for flags, keyed by flag text (see below where these are
    // written). Carried through here explicitly for the same reason as
    // usedAngles — this function rebuilds cf from scratch, so anything not
    // named here silently resets every turn.
    iodAges: { ...(existing.iodAges || {}) },
    turnCount: existing.turnCount || 0,
    // Small personal details worth calling back to later — separate from IOIs
    // (which are evidence of interest) and from the 22 markers (which are
    // evidence of character). Persisted the same way so they survive long
    // threads and summarization instead of being mentioned once and lost.
    quirks: [...(existing.quirks || [])],
    reportedUnverified: dedupeNear([...(existing.reportedUnverified || []), ...((card.reported_unverified || []).map(asText))]),
    contradictionAlerts: [...(existing.contradictionAlerts || [])],
    // Ella exception: once she's genuinely unprompted-initiated a number/meet
    // close, that's a permanent fact about this thread, not something the
    // model needs to keep re-asserting turn to turn — sticky like markers.
    herInitiatedClose: existing.herInitiatedClose === true || card.her_initiated_close === true,
    // Deterministic angle tracking (see computeAngle) — this function is the
    // only place caseFile gets rebuilt, so these have to be carried through
    // here explicitly or they silently reset every turn. Nothing in this
    // function derives them; computeAngle recomputes `angle` fresh and grows
    // `usedAngles` in updateCaseFile, this just has to not drop them.
    usedAngles: [...(existing.usedAngles || [])],
    angle: existing.angle || null,
    // Same carry-through requirement for the hunt target (see
    // computeOpenThread), which updateCaseFile recomputes after this runs.
    usedTargets: [...(existing.usedTargets || [])],
    openThread: existing.openThread || null,
  };
  if (card.disqualifier_alert && card.disqualifier_alert !== "null") {
    const t = asText(card.disqualifier_alert);
    if (t && !cf.disqualifiers.includes(t)) cf.disqualifiers.push(t);
  }
  (card.markers_confirmed || []).forEach(m => {
    const t = canonicalMarker(m);
    if (t && !cf.markersConfirmed.includes(t)) cf.markersConfirmed.push(t);
  });
  (card.markers_contradicted || []).forEach(m => {
    const t = canonicalMarker(m);
    if (t && !cf.markersContradicted.includes(t)) cf.markersContradicted.push(t);
  });
  (card.iois || []).forEach(x => { const t = asText(x); if (t) cf.iois.push(t); });
  (card.bids || []).forEach(x => { const t = asText(x); if (t) cf.bids.push(t); });
  (card.iods || []).forEach(x => { const t = asText(x); if (t) cf.iods.push(t); });
  (card.quirks || []).forEach(x => { const t = asText(x); if (t) cf.quirks.push(t); });
  cf.iois = dedupeList(cf.iois);
  cf.bids = dedupeList(cf.bids);
  cf.iods = dedupeList(cf.iods);
  cf.quirks = dedupeList(cf.quirks);
  // Flags need an age. Previously they were pushed once and persisted forever
  // with no way to expire, so a one-off "zero effort reply" from days ago kept
  // rendering next to cards analysing detailed, engaged messages — and kept
  // being fed to the model as if it were live. Stamp each flag with the turn
  // it was first seen; display and prompt both decay off that.
  cf.turnCount = (existing.turnCount || 0) + 1;
  cf.iodAges = { ...(existing.iodAges || {}) };
  // Only stamp flags that actually ARRIVED this turn. Stamping every flag in
  // the list was the bug: it gave already-old flags a fresh timestamp on the
  // first merge after this feature shipped, so nothing could ever age out.
  const arrivedThisTurn = new Set((card.iods || []).map(asText).filter(Boolean));
  cf.iods.forEach(t => {
    if (cf.iodAges[t] != null) return;              // already stamped, leave it
    // 0 is the legacy sentinel: a flag that predates age tracking. Treated as
    // historic on sight rather than resurrected as a current read.
    cf.iodAges[t] = arrivedThisTurn.has(t) ? cf.turnCount : 0;
  });
  // Drop age entries for flags no longer in the list at all, so this can't
  // grow unbounded across a long thread.
  Object.keys(cf.iodAges).forEach(k => { if (!cf.iods.includes(k)) delete cf.iodAges[k]; });
  // Hardcore marker merge happens last, against the disqualifier/iois-updated
  // cf so mergeHardcoreSignals can detect a contradiction landing against a
  // marker that was ALREADY confirmed before this turn's signals — that's
  // the "contradiction tracking against prior confirmations" requirement,
  // surfaced as a visible alert rather than a silent state change.
  const herResult = mergeHardcoreSignals(existing.herMarkers, card.her_markers, HER_MARKERS);
  const hisResult = mergeHardcoreSignals(existing.hisMarkers, card.his_markers, HIS_MARKERS);
  cf.herMarkers = herResult.markers;
  cf.hisMarkers = hisResult.markers;
  cf.contradictionAlerts.push(...herResult.newAlerts, ...hisResult.newAlerts);
  return cf;
}

// Accumulates hardcore blueprint her/his_markers SIGNALS (confirm/contradict
// instances, never a state) into the persisted count object per marker. This
// is the only place instance counts are written — the model never writes a
// count or a state directly, only ever "this instance confirms/contradicts
// X", so the persisted number can't drift from what was actually reported.
// Also detects and surfaces the specific case Kwasi flagged: a contradicting
// instance landing against a marker that was CONFIRMED before this signal —
// that's worth a visible alert, not just a quiet count change.
function mergeHardcoreSignals(existing, signals, canonicalList) {
  const acc = { ...(existing || {}) };
  const newAlerts = [];
  (signals || []).forEach(m => {
    if (!m?.name || (m.signal !== "confirm" && m.signal !== "contradict")) return;
    const nm = canonicalHardcoreMarker(m.name, canonicalList);
    const prev = acc[nm] || { confirmCount: 0, contradictCount: 0, reasons: [] };
    const wasConfirmed = deriveMarkerState(prev.confirmCount, prev.contradictCount).state === "confirmed";
    if (wasConfirmed && m.signal === "contradict") {
      newAlerts.push(`${nm}: previously confirmed (${prev.confirmCount} confirming instances), now contradicted — ${asText(m.reason)}`);
    }
    acc[nm] = {
      confirmCount: prev.confirmCount + (m.signal === "confirm" ? 1 : 0),
      contradictCount: prev.contradictCount + (m.signal === "contradict" ? 1 : 0),
      // Keep only the 3 most recent reasons per marker — enough context for
      // the model and the UI without the case file growing unbounded over
      // a long-running thread with dozens of instances per marker.
      reasons: [...(prev.reasons || []), asText(m.reason)].filter(Boolean).slice(-3),
    };
  });
  return { markers: acc, newAlerts };
}

function caseFileSummary(caseFile, stage) {
  if (!caseFile) return "";
  const cf = caseFile;
  const isHardcore = typeof stage === "string" && stage.startsWith("C");
  const lines = [];

  // THE BUG THIS FIXES: computeAngle has been running every C1-C3 turn,
  // writing cf.angle, and rendering it on the card as "Live Angle" — but this
  // function never included it, and this function is the ONLY thing that
  // reaches the API. Meanwhile the system prompt explicitly told the model
  // "the app also computes a guaranteed angle in code... treat it as a floor".
  // So the prompt was instructing the model to use data it had never once
  // been sent. Every quirk and unused IOI the angle generator surfaced went
  // to the screen and nowhere else, which is exactly why logged details kept
  // never coming back in conversation.
  if (cf.angle) {
    lines.push(`>> LIVE ANGLE (computed by the app from a logged, unused detail — this is a FLOOR, use it unless this turn genuinely gives you something sharper, and never claim there's nothing to work with)${cf.angle.topic ? " · " + cf.angle.topic : ""}: ${cf.angle.text}`);
  }

  // Action quirks: things she's said about HOW she likes to be contacted or
  // when. These are instructions, not conversation topics, so they get their
  // own directive line rather than being buried in the general quirks list.
  const actionQuirks = splitQuirks(cf.quirks).action;
  if (actionQuirks.length) {
    lines.push(">> HER STATED PREFERENCES ABOUT CONTACT (channel/timing/ritual she has actually said out loud — these are instructions, not topics. Set `medium` and shape `move` around them: if she's said she'd rather be called, the move is to call her, not to draft another text):\n" + actionQuirks.map(a => `- [${a.action}] ${a.text}`).join("\n"));
  }

  // Hunt target next — it's the single most actionable line in this block
  // and it should be the thing shaping the reply, not a footnote after a
  // wall of accumulated evidence.
  if (cf.openThread) {
    lines.push(cf.openThread.live
      ? `>> STILL OPEN, AND SHE HAS OPENED THE DOOR: ${cf.openThread.name} (${cf.openThread.status}). ${cf.openThread.text}`
      : `>> STILL OPEN, NO DOOR RIGHT NOW: ${cf.openThread.name} (${cf.openThread.status}). ${cf.openThread.text}`);
  }
  if (cf.disqualifiers && cf.disqualifiers.length) lines.push("Disqualifiers flagged so far: " + cf.disqualifiers.join(" | "));
  if (cf.markersConfirmed && cf.markersConfirmed.length) lines.push("Blueprint markers confirmed to date: " + cf.markersConfirmed.join(" | "));
  if (cf.markersContradicted && cf.markersContradicted.length) lines.push("Blueprint markers contradicted to date: " + cf.markersContradicted.join(" | "));

  // Hardcore blueprint state, told to the model as DERIVED fact (never as
  // something it should recompute or recount) — this is what keeps its
  // prose consistent with the real gate box even before a turn's own
  // her_markers/his_markers deltas are added on top.
  const herLines = HER_MARKERS.map(n => {
    const e = cf.herMarkers?.[n];
    if (!e) return null;
    const d = deriveMarkerState(e.confirmCount, e.contradictCount);
    if (d.state === "no data") return null;
    return `${n}: ${d.state} (${d.detail})`;
  }).filter(Boolean);
  const hisLines = HIS_MARKERS.map(n => {
    const e = cf.hisMarkers?.[n];
    if (!e) return null;
    const d = deriveMarkerState(e.confirmCount, e.contradictCount);
    if (d.state === "no data") return null;
    return `${n}: ${d.state} (${d.detail})`;
  }).filter(Boolean);
  if (herLines.length) lines.push("Hardcore blueprint — HER markers with any evidence so far (state is CODE-DERIVED from instance counts, do not restate as a different state, do not state the totals in your reasoning):\n" + herLines.join("\n"));
  if (hisLines.length) lines.push("Hardcore blueprint — HIS markers with any evidence so far:\n" + hisLines.join("\n"));
  if (cf.reportedUnverified && cf.reportedUnverified.length) {
    lines.push("Reported but unverified so far — she told him these, nothing has independently corroborated them yet. TWO jobs, not one: (a) never count them as confirming instances, and (b) THESE ARE ALSO KNOWN FACTS ABOUT HER, so do not write as though you've never heard them. If one of these is relevant to what she just said, reference it naturally the way anyone who'd been listening would, and look for a light chance to have it corroborated in ordinary conversation:\n" + cf.reportedUnverified.map(x => "- " + x).join("\n"));
  }
  // IOIs are an attraction-momentum instrument: they answer "is she
  // interested", which is a live question in A1-A3 and a settled one by C1.
  // From C1 the read that matters is bids and turning-toward, so the list is
  // relabelled rather than dumped — it still exists as angle fuel either way.
  if (cf.iois && cf.iois.length && !isHardcore) lines.push("IOIs logged to date (do not repeat these, only report genuinely new ones): " + cf.iois.join(" | "));
  if (isHardcore) {
    if (cf.bids && cf.bids.length) lines.push("Bids logged to date (do not repeat these, only report genuinely new ones): " + cf.bids.join(" | "));
    lines.push("STAGE NOTE: this is a C-stage thread. Do NOT report `iois` — interest is established and counting it again tells Kwasi nothing. Report `bids` instead: what she reached for, whether it was direct or indirect, high rung or low rung, and whether the suggested reply turns toward it.");
  }
  if (cf.iods && cf.iods.length) {
    // Live and historic flags are presented differently. An aged-out flag is
    // still on record but must not be treated as a current read on her — the
    // old behaviour fed every flag ever logged back as if it were live, which
    // is how a single "zero effort reply" from days ago kept colouring reads
    // of detailed, engaged messages.
    const { active, historic } = splitFlagsByAge(cf);
    if (active.length) lines.push("ACTIVE flags (current, still live reads): " + active.join(" | "));
    if (historic.length) lines.push("HISTORIC flags (older, already aged out — on record only, do NOT treat these as a current read on her or repeat them as if they just happened): " + historic.join(" | "));
    lines.push("Do not re-report any flag above as new. Only report genuinely new ones this turn.");
  }
  const contentQuirks = splitQuirks(cf.quirks).content.map(q => q.text);
  if (contentQuirks.length) lines.push("Personal quirks/callbacks logged to date — look for natural openings to actually reference these, don't just note and forget them (the contact preferences above are listed separately and are instructions, not topics): " + contentQuirks.join(" | "));
  if (cf.contradictionAlerts && cf.contradictionAlerts.length) lines.push("Contradiction alerts (a marker previously confirmed that later got contradicted): " + cf.contradictionAlerts.join(" | "));

  let out = "";
  if (lines.length) out += "PERMANENT CASE FILE (accumulated across the whole history, do not contradict or forget this even though older messages are out of view):\n" + lines.join("\n") + "\n";
  if (cf.summary) out += "\nRUNNING SUMMARY OF EARLIER CONVERSATION (messages this covers are no longer in the raw context below):\n" + cf.summary + "\n";
  if (out) out += "---\n\n";
  return out;
}

// Holds a screen wake lock for the duration of a request where supported.
// The screen switching off mid-analysis is what suspends the tab and kills the
// connection, so the cheapest fix is to stop it switching off while we're
// waiting. Best-effort only — unsupported browsers just get the retry path.
async function withWakeLock(fn) {
  let lock = null;
  try { if (navigator.wakeLock?.request) lock = await navigator.wakeLock.request("screen"); }
  catch { /* denied or unsupported — carry on without it */ }
  try { return await fn(); }
  finally { try { await lock?.release(); } catch { /* already gone */ } }
}

// ---------------------------------------------------------------------------
// STREAMING
//
// The 10-20 second waits were never really about the model being slow — they
// were about nothing being shown until every last output token had arrived,
// and a full C-stage card is a lot of output tokens. This reads the SSE
// stream and hands text to onDelta as it lands.
//
// It also fixes the "NetworkError when attempting to fetch resource" that
// appears whenever the phone screen switches off mid-request: the tab gets
// suspended, the connection dies, and the old code lost the whole turn with
// no way back except retyping. Now whatever arrived before the drop is
// returned as `partial`, and the caller can offer a one-tap retry.
async function streamAnalysis(apiMsgs, onDelta) {
  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: MAIN_MODEL, system: SYSTEM, messages: apiMsgs, stream: true }),
  });

  const ctype = res.headers.get("content-type") || "";
  // The proxy answers errors as plain JSON even on a streaming request, and
  // falls back to JSON entirely if streaming is unavailable — so an old
  // deployed api/chat.js that ignores the stream flag still works here.
  if (!ctype.includes("text/event-stream")) {
    const raw = await res.text();
    let d;
    try { d = JSON.parse(raw); } catch {
      throw new Error("Server returned non-JSON (HTTP " + res.status + "). This usually means api/chat.js is crashing. First 200 chars: " + raw.slice(0, 200));
    }
    if (d.error) throw new Error("API error: " + (typeof d.error === "string" ? d.error : (d.error.message || JSON.stringify(d.error))));
    return {
      text: d.content?.map(b => b.text || "").join("") || d.result || "",
      usage: d.usage || null,
      stopReason: d.stop_reason || null,
      partial: false,
    };
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  let text = "";
  let stopReason = null;
  let usage = null;
  let sawStop = false;

  try {
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop() || "";
      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (!payload || payload === "[DONE]") continue;
        let ev;
        try { ev = JSON.parse(payload); } catch { continue; }
        if (ev.type === "error") {
          throw new Error("API error: " + (ev.error?.message || JSON.stringify(ev.error)));
        }
        if (ev.type === "message_start" && ev.message?.usage) {
          usage = { ...ev.message.usage };
        }
        if (ev.type === "content_block_delta" && ev.delta?.type === "text_delta") {
          text += ev.delta.text || "";
          if (onDelta) onDelta(text);
        }
        if (ev.type === "message_delta") {
          if (ev.delta?.stop_reason) stopReason = ev.delta.stop_reason;
          if (ev.usage) usage = { ...(usage || {}), ...ev.usage };
        }
        if (ev.type === "message_stop") sawStop = true;
      }
    }
  } catch (err) {
    // Connection died mid-stream — almost always the screen switching off and
    // the tab being suspended. Anything already received is kept and handed
    // back rather than thrown away.
    if (text) return { text, usage, stopReason, partial: true, error: err };
    throw err;
  }

  // A stream that ends without message_stop was cut short, even if no error
  // was raised. Treat it as partial so it can't be mistaken for a clean turn.
  return { text, usage, stopReason, partial: !sawStop };
}

const MAIN_MODEL = "claude-sonnet-5";
const SUMMARY_MODEL = "claude-haiku-4-5-20251001";
const HISTORY_CAP = 60;

// $ per million tokens. Sonnet 5 intro pricing runs through Aug 31 2026,
// then input/output move to $3/$15 — update the sonnet row after that date.
// Check current rates at https://docs.claude.com/en/docs/about-claude/pricing
const PRICING = {
  "claude-sonnet-5": { in: 2, out: 10 },
  "claude-haiku-4-5-20251001": { in: 1, out: 5 },
};

function costFor(model, usage) {
  if (!usage) return null;
  const p = PRICING[model] || PRICING["claude-sonnet-5"];
  const inTok = usage.input_tokens || 0;
  const outTok = usage.output_tokens || 0;
  // Cache reads bill at ~10% of normal input price; cache writes at ~1.25x.
  // Included so the number reflects real cost if prompt caching ever gets added.
  const cacheRead = usage.cache_read_input_tokens || 0;
  const cacheWrite = usage.cache_creation_input_tokens || 0;
  return (inTok / 1e6) * p.in + (outTok / 1e6) * p.out + (cacheRead / 1e6) * p.in * 0.1 + (cacheWrite / 1e6) * p.in * 1.25;
}

// Condenses messages that are about to fall out of the API context window into
// a running narrative, using the cheap model. This is pure compression, not
// judgment, so Haiku is the right tool here even though it's not used for coaching.
async function summarizeAging(prospectName, priorSummary, agingMsgs) {
  const transcript = agingMsgs.map(m => {
    if (m.role === "user") return m.content;
    const { text } = parseMsg(m.content);
    return "[THE FILTER]: " + text;
  }).join("\n");
  const sys = "You condense dating-app coaching chat history into a short running narrative. You will be given the existing summary (may be empty) and a chunk of older messages about to be dropped from context. Merge them into an updated summary under 200 words: key facts " + prospectName + " has shared (job, family, values, timeline, red or green flags), what Kwasi has actually sent her, and anything unresolved. Plain prose, no headers, no JSON, third person. Output ONLY the updated summary text.";
  const userContent = "EXISTING SUMMARY:\n" + (priorSummary || "(none yet)") + "\n\nOLDER MESSAGES TO FOLD IN:\n" + transcript;
  try {
    const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: SUMMARY_MODEL, system: sys, messages: [{ role: "user", content: userContent }] }) });
    const d = await res.json();
    const text = d.content?.map(b => b.text || "").join("") || "";
    return text.trim() || priorSummary || "";
  } catch (e) {
    console.error("summarization failed, keeping prior summary:", e);
    return priorSummary || "";
  }
}

// Once an IOI/flag/quirk list crosses this many entries, it's grown past
// what dedupeList's literal-substring matching can catch — the same
// underlying pattern logged five different ways looks like five distinct
// entries to it. Consolidation compresses down to a capped set of named
// patterns instead. Deliberately above the 8-item display cap so a freshly
// consolidated list has real room before it triggers again.
const CONSOLIDATE_THRESHOLD = 15;

// Collapses a long, repetitive IOI/flag/quirk list into a short set of
// distinct, named patterns — pure compression, not judgment, so this runs on
// the cheap model exactly like summarizeAging does. Returns null on any
// failure so the caller can safely leave the existing (uncompressed but
// intact) list alone rather than risk losing real data on a bad response.
async function consolidateEvidenceList(prospectName, label, items) {
  const sys = `You compress a list of logged ${label} for a dating prospect named ${prospectName} down to the strongest distinct patterns. Multiple lines describing the same underlying pattern in different words must become ONE line, phrased as a concrete named pattern (e.g. "consistently initiates conversation" rather than repeating each individual time she said hi first). Keep the most specific, concrete wording available across whatever you merge — don't flatten it into something vaguer than the input. Never invent anything the input doesn't support. Output at most 8 lines, fewer if there are genuinely fewer than 8 distinct patterns. Output ONLY a JSON array of strings — no prose, no markdown fences, nothing else.`;
  const userContent = items.map(x => "- " + x).join("\n");
  try {
    const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: SUMMARY_MODEL, system: sys, messages: [{ role: "user", content: userContent }] }) });
    const d = await res.json();
    const raw = (d.content?.map(b => b.text || "").join("") || "").trim().replace(/^```json\s*|^```\s*|```\s*$/g, "");
    const arr = JSON.parse(raw);
    if (Array.isArray(arr) && arr.length) return arr.map(asText).filter(Boolean).slice(0, 8);
  } catch (e) {
    console.error("consolidateEvidenceList failed, keeping raw list:", e);
  }
  return null;
}

function App() {
  const [prospects, setProspects] = useState(() => { try { return JSON.parse(localStorage.getItem("tf-prospects") || "[]"); } catch { return []; } });
  const [selected, setSelected] = useState(null);
  const [showNew, setShowNew] = useState(false);
  const [repairResult, setRepairResult] = useState(null);
  const [topicAuditResult, setTopicAuditResult] = useState(null);
  // Tracks which prospect+field consolidation calls are currently in flight.
  // Without this, the consolidation trigger below (list.length > threshold)
  // fires again on every subsequent turn while a list stays over threshold
  // and the previous Haiku call hasn't resolved yet — wasted duplicate API
  // calls, and whichever response lands last wins even if it was working
  // from a staler, smaller snapshot of the list. A ref (not state) is right
  // here since this is bookkeeping for an async side effect, not something
  // that should ever trigger a re-render.
  const consolidatingRef = useRef(new Set());

  useEffect(() => {
    try { localStorage.setItem("tf-prospects", JSON.stringify(prospects)); }
    catch (e) { console.error("prospects storage write failed:", e); }
  }, [prospects]);

  // Read the freshest persisted caseFile for one prospect directly off disk,
  // bypassing this session's in-memory state entirely. Used as a safety net
  // when writing caseFile updates: if this tab/session has been open a while
  // (or another tab/reload pushed the same prospect further in the meantime),
  // React state here can be stale. Always reconciling against disk first means
  // a stale session can add to the case file but never silently erase markers
  // that were confirmed elsewhere since this session last synced.
  function freshestCaseFile(id, fallback) {
    try {
      const onDisk = JSON.parse(localStorage.getItem("tf-prospects") || "[]");
      const match = onDisk.find(p => p.id === id);
      return (match && match.caseFile) || fallback || {};
    } catch { return fallback || {}; }
  }

  function addProspect(p) { setProspects(ps => [...ps, p]); setSelected(p.id); setShowNew(false); }
  function updateStage(id, stage) { setProspects(ps => ps.map(p => p.id === id ? { ...p, stage } : p)); }
  // Reconciles two hardcore-marker count objects by taking the MAX of each
  // count per marker (never the sum — these are two views of the same
  // underlying history, not two separate sets of new instances, so adding
  // them would double-count). Safe: can only recover a higher count that
  // existed on disk, never invents or loses one.
  function reconcileHardcoreMarkers(a, b) {
    const out = { ...(a || {}) };
    Object.keys(b || {}).forEach(name => {
      const x = out[name] || { confirmCount: 0, contradictCount: 0, reasons: [] };
      const y = b[name] || {};
      out[name] = {
        confirmCount: Math.max(x.confirmCount || 0, y.confirmCount || 0),
        contradictCount: Math.max(x.contradictCount || 0, y.contradictCount || 0),
        reasons: Array.from(new Set([...(x.reasons || []), ...(y.reasons || [])])).slice(-3),
      };
    });
    return out;
  }

  function updateCaseFile(id, card, recentText) {
    let followUp = null; // captured out of setProspects so we can kick off async work after
    setProspects(ps => ps.map(p => {
      if (p.id !== id) return p;
      // Merge onto whichever caseFile is more complete: this session's memory,
      // or whatever's newest on disk (in case another session moved it further
      // since this one last loaded). mergeCaseFile is additive/deduped for the
      // array fields, so merging the disk version in first is always safe —
      // it can only add. Hardcore marker counts reconcile separately by max.
      const disk = freshestCaseFile(id, p.caseFile);
      const reconciled = mergeCaseFile(p.caseFile || {}, { markers_confirmed: disk.markersConfirmed, markers_contradicted: disk.markersContradicted, disqualifier_alert: null });
      reconciled.herMarkers = reconcileHardcoreMarkers(reconciled.herMarkers, disk.herMarkers);
      reconciled.hisMarkers = reconcileHardcoreMarkers(reconciled.hisMarkers, disk.hisMarkers);
      reconciled.reportedUnverified = dedupeNear([...(reconciled.reportedUnverified || []), ...(disk.reportedUnverified || [])]);
      reconciled.iois = Array.from(new Set([...(reconciled.iois || []), ...(disk.iois || [])]));
      reconciled.iods = Array.from(new Set([...(reconciled.iods || []), ...(disk.iods || [])]));
      // Keep the EARLIEST age stamp per flag across both copies, so a flag
      // doesn't get its clock reset (and come back to life) just because
      // another tab re-merged it.
      reconciled.iodAges = { ...(disk.iodAges || {}) };
      Object.entries((p.caseFile || {}).iodAges || {}).forEach(([k, v]) => {
        if (reconciled.iodAges[k] == null || v < reconciled.iodAges[k]) reconciled.iodAges[k] = v;
      });
      reconciled.turnCount = Math.max(reconciled.turnCount || 0, disk.turnCount || 0);
      reconciled.contradictionAlerts = Array.from(new Set([...(reconciled.contradictionAlerts || []), ...(disk.contradictionAlerts || [])]));
      let merged = mergeCaseFile(reconciled, card);
      // Deterministic angle generator (see computeAngle) — recomputed from
      // the freshly merged case file every time so it always reflects the
      // current unused quirks/IOIs and the current stage, independent of
      // whether the model's own read produced anything usable this turn.
      // Burn the PREVIOUS angle only if this turn's output genuinely used it.
      // It used to mark whatever it had just computed as used immediately,
      // every turn, regardless — so each quirk got exactly one turn of
      // visibility and was then gone forever, including on the many turns
      // where the angle never made it into a reply at all. That silently
      // drained the pool and is a second reason logged details stopped
      // resurfacing.
      const priorAngle = (p.caseFile || {}).angle || null;
      const burned = angleWasUsed(priorAngle, card) && priorAngle.sourceItem
        ? Array.from(new Set([...(merged.usedAngles || []), priorAngle.sourceItem]))
        : (merged.usedAngles || []);
      merged = { ...merged, usedAngles: burned };
      const angle = computeAngle(merged, card.stage || p.stage);
      if (angle) merged = { ...merged, angle };
      // Open thread (see computeOpenThread) — derived in code from the merged
      // case file plus what SHE just said. Only recorded in usedTargets when
      // her own words actually opened a door, so a marker sitting untouched
      // because she never went near it doesn't get rotated away and lost.
      const openThread = computeOpenThread(merged, card.stage || p.stage, recentText);
      merged = {
        ...merged,
        openThread: openThread || null,
        usedTargets: openThread && openThread.live ? [...(merged.usedTargets || []), openThread.name].slice(-12) : (merged.usedTargets || []),
      };
      followUp = { name: p.name, caseFile: merged };
      return { ...p, caseFile: merged };
    }));
    // Background consolidation: fire-and-forget, runs after the synchronous
    // merge above so it never blocks the card render. If a list has grown
    // past CONSOLIDATE_THRESHOLD, one cheap Haiku call collapses it into a
    // capped set of named patterns; on any failure the raw list is left
    // exactly as it was (consolidateEvidenceList returns null, never partial).
    if (followUp) {
      const { name, caseFile } = followUp;
      [["iois", "interest signals (IOIs)"], ["iods", "flags"], ["quirks", "personal quirks/callbacks"]].forEach(async ([field, label]) => {
        const list = caseFile[field] || [];
        const key = id + ":" + field;
        if (list.length <= CONSOLIDATE_THRESHOLD || consolidatingRef.current.has(key)) return;
        consolidatingRef.current.add(key);
        try {
          const consolidated = await consolidateEvidenceList(name, label, list);
          if (consolidated && consolidated.length) {
            setProspects(ps => ps.map(p => p.id === id ? { ...p, caseFile: { ...(p.caseFile || {}), [field]: consolidated } } : p));
          }
        } finally {
          consolidatingRef.current.delete(key);
        }
      });
    }
  }
  function updateSummary(id, summary, summarizedThrough) { setProspects(ps => ps.map(p => p.id === id ? { ...p, caseFile: { ...(p.caseFile || {}), summary, summarizedThrough } } : p)); }
  function removeProspect(id) { if(confirm("Remove this prospect?")) { setProspects(ps => ps.filter(p => p.id !== id)); localStorage.removeItem("chat-" + id); } }

  const cp = prospects.find(p => p.id === selected);

  if (cp) return <Chat prospect={cp} onBack={() => setSelected(null)} onStageUpdate={updateStage} onCaseFileUpdate={updateCaseFile} onSummaryUpdate={updateSummary} />;

  // Rebuilds a prospect's marker/disqualifier set from scratch by walking
  // every assistant message in their full chat history and re-running the
  // same canonicalize+merge logic mergeCaseFile already uses live. The raw
  // card data for every past turn is still sitting in localStorage regardless
  // of what happened to the separately-tracked caseFile, so this recovers
  // anything that got dropped by the stale-tab overwrite bug.
  function rebuildCaseFileFromHistory(prospectId) {
    let chat = [];
    try { chat = JSON.parse(localStorage.getItem("chat-" + prospectId) || "[]"); } catch {}
    let rebuilt = { disqualifiers: [], markersConfirmed: [], markersContradicted: [], herMarkers: {}, hisMarkers: {}, reportedUnverified: [], iois: [], bids: [], iods: [], quirks: [], contradictionAlerts: [] };
    let cardCount = 0;
    chat.forEach(m => {
      if (m.role !== "assistant") return;
      const { card } = parseMsg(m.content);
      if (card) { rebuilt = mergeCaseFile(rebuilt, card); cardCount++; }
    });
    // Repair now REPLACES the free-text evidence lists rather than unioning
    // them (see repairAllMarkerData), so callers have to be able to tell
    // "history says this list is empty" from "there is no history to read".
    // Wiping a case file because a chat log was cleared would be a disaster.
    rebuilt._cardCount = cardCount;
    return rebuilt;
  }

  // Free, local, no API call: replays a prospect's full saved history in
  // order and re-checks every light-sift-to-hardcore stage jump against the
  // real Number Close gate (20+ exchanges, 5+ of the 10 light-sift markers),
  // the same check the live code runs going forward — just applied backward
  // over data that's already sitting in localStorage. Catches exactly the
  // Minnie situation: a stage that got saved as C1+ before this gate existed
  // or before it was met.
  // Real limitation, stated plainly rather than papered over: this can only
  // catch the FIRST bad jump into hardcore territory. Once a jump happens,
  // the model stops producing light-sift marker data from that point on (by
  // its own instructions, it switches format), so anything logged after a
  // bad jump can't be re-verified from saved data alone — that needs a paid
  // re-scan of the actual transcript, not this free pass.
  function checkStageIntegrity(prospectId) {
    let chat = [];
    try { chat = JSON.parse(localStorage.getItem("chat-" + prospectId) || "[]"); } catch {}
    let runningStage = "A1";
    let exchangeCount = 0;
    const confirmedSet = new Set();
    let unpromptedClose = false; // Ella exception, sticky once true — see mergeCaseFile
    let violation = null;
    for (const m of chat) {
      if (m.role === "user" && (m.content.startsWith("[HER]") || m.content.startsWith("[I SENT THIS]"))) {
        exchangeCount++;
        continue;
      }
      if (m.role !== "assistant") continue;
      const { card } = parseMsg(m.content);
      if (!card || !card.stage) continue;
      (card.markers_confirmed || []).forEach(x => confirmedSet.add(canonicalMarker(x)));
      if (card.her_initiated_close === true) unpromptedClose = true;
      const wasLightSift = !runningStage.startsWith("C");
      const attempted = card.stage;
      if (wasLightSift && attempted.startsWith("C")) {
        if ((exchangeCount < 20 && !unpromptedClose) || confirmedSet.size < 5) {
          violation = { atStage: attempted, exchangeCount, confirmedCount: confirmedSet.size, unpromptedClose };
          break;
        }
      }
      runningStage = attempted;
    }
    return { verifiedStage: violation ? "A3" : runningStage, violation };
  }

  // Topic coverage audit — read-only, no API cost, touches nothing. Same
  // "replay the saved case file locally" mechanism as the Repair below, but
  // this one never writes anything back, it only reports. Built for exactly
  // what Rue exposed: she reached C3 with Trust & Commitment, a C1 topic,
  // never once touched, and nothing surfaced that until it was checked by
  // hand. This checks every C-stage prospect for the same pattern — a topic
  // native to an EARLIER stage than where they currently sit, with zero
  // evidence logged against any marker under it. Stage label is never
  // touched, this is purely a report to look at, going forward computeAngle
  // and STILL OPEN already self-correct (see the Rue fix above), this just
  // makes existing gaps visible without needing to stumble onto them.
  const ALL_EIGHT_DATES_TOPICS = ["Trust & Commitment", "Fun & Adventure", "Conflict", "Work & Money", "Family", "Growth & Spirituality", "Dreams", "Sex & Intimacy"];
  function auditTopicCoverage() {
    const results = prospects
      .filter(p => (p.stage || "").startsWith("C"))
      .map(p => {
        const cf = p.caseFile || {};
        const stageRank = STAGE_ORDER.indexOf(p.stage) + 1; // C1->1, C2->2, C3->3
        const topics = ALL_EIGHT_DATES_TOPICS.map(topic => {
          const markersInTopic = [...HER_MARKERS, ...HIS_MARKERS].filter(m => MARKER_TOPIC[m] === topic);
          let confirmed = 0, touched = 0;
          markersInTopic.forEach(m => {
            const entry = cf.herMarkers?.[m] || cf.hisMarkers?.[m];
            const d = deriveMarkerState(entry?.confirmCount, entry?.contradictCount);
            if (d.state === "confirmed") confirmed++;
            else if (d.state !== "no data") touched++;
          });
          const topicRank = TOPIC_STAGE_RANK[topic];
          // Stale = a topic native to a stage this prospect has already moved
          // past, with literally nothing logged against it — not "thin",
          // genuinely untouched. A topic native to the CURRENT or a later
          // stage isn't flagged even at zero, it hasn't come up yet, that's
          // expected, not a gap.
          const stale = topicRank < stageRank && confirmed === 0 && touched === 0;
          return { topic, topicRank, confirmed, touched, total: markersInTopic.length, stale };
        });
        return { name: p.name, stage: p.stage, staleTopics: topics.filter(t => t.stale) };
      });
    setTopicAuditResult(results);
  }

  // Additive-only repair: unions the rebuilt-from-history set with whatever's
  // currently saved, for every prospect. Never removes anything already
  // present, so worst case for any given prospect is a no-op. Hardcore marker
  // counts reconcile by max (via reconcileHardcoreMarkers), same principle.
  function repairAllMarkerData() {
    const results = [];
    setProspects(ps => ps.map(p => {
      const rebuilt = rebuildCaseFileFromHistory(p.id);
      const existing = p.caseFile || {};
      // Only safe to prune from history when there IS history with real cards
      // in it. Two cards is the floor — a single card is too thin a basis for
      // throwing away an accumulated list.
      const rebuiltFromRealHistory = (rebuilt._cardCount || 0) >= 2;
      const mergedHer = reconcileHardcoreMarkers(existing.herMarkers, rebuilt.herMarkers);
      const mergedHis = reconcileHardcoreMarkers(existing.hisMarkers, rebuilt.hisMarkers);
      const merged = {
        ...existing,
        disqualifiers: Array.from(new Set([...(existing.disqualifiers || []), ...rebuilt.disqualifiers])),
        markersConfirmed: Array.from(new Set([...(existing.markersConfirmed || []), ...rebuilt.markersConfirmed])),
        markersContradicted: Array.from(new Set([...(existing.markersContradicted || []), ...rebuilt.markersContradicted])),
        herMarkers: mergedHer,
        hisMarkers: mergedHis,
        // These four REPLACE rather than union — this is the fix for "repair
        // never actually cleans anything up". Marker counts and disqualifiers
        // stay additive above (losing a confirmed marker to a parsing quirk
        // would be far worse than keeping a stale one), but the free-text
        // evidence lists are exactly where cruft accumulates: consolidated
        // entries sitting next to the raw ones they replaced, near-duplicates
        // from before dedupeNear existed, flags from threads long since moved
        // on. Rebuilding them from the saved cards is the only way anything
        // ever leaves. Guarded by rebuiltFromRealHistory so a prospect whose
        // chat log was cleared doesn't get their case file wiped by a repair.
        reportedUnverified: rebuiltFromRealHistory ? dedupeNear(rebuilt.reportedUnverified) : Array.from(new Set([...(existing.reportedUnverified || []), ...rebuilt.reportedUnverified])),
        iois: rebuiltFromRealHistory ? dedupeList(rebuilt.iois) : Array.from(new Set([...(existing.iois || []), ...rebuilt.iois])),
        bids: rebuiltFromRealHistory ? dedupeList(rebuilt.bids || []) : Array.from(new Set([...(existing.bids || []), ...(rebuilt.bids || [])])),
        iods: rebuiltFromRealHistory ? dedupeList(rebuilt.iods) : Array.from(new Set([...(existing.iods || []), ...rebuilt.iods])),
        quirks: rebuiltFromRealHistory ? dedupeList(rebuilt.quirks) : Array.from(new Set([...(existing.quirks || []), ...rebuilt.quirks])),
        contradictionAlerts: Array.from(new Set([...(existing.contradictionAlerts || []), ...rebuilt.contradictionAlerts])),
      };
      const beforeHardcore = HER_MARKERS.filter(n => deriveMarkerState(existing.herMarkers?.[n]?.confirmCount, existing.herMarkers?.[n]?.contradictCount).state === "confirmed").length
        + HIS_MARKERS.filter(n => deriveMarkerState(existing.hisMarkers?.[n]?.confirmCount, existing.hisMarkers?.[n]?.contradictCount).state === "confirmed").length;
      const afterHardcore = HER_MARKERS.filter(n => deriveMarkerState(mergedHer?.[n]?.confirmCount, mergedHer?.[n]?.contradictCount).state === "confirmed").length
        + HIS_MARKERS.filter(n => deriveMarkerState(mergedHis?.[n]?.confirmCount, mergedHis?.[n]?.contradictCount).state === "confirmed").length;
      const before = (existing.markersConfirmed || []).length + beforeHardcore;
      const after = merged.markersConfirmed.length + afterHardcore;

      // Stage integrity check — free, local, replays saved history against
      // the real Number Close gate. If the currently stored stage doesn't
      // match what the gate actually supports, correct it and flag that a
      // paid re-scan is the only way to properly re-derive markers for
      // whatever period followed the bad jump.
      const integrity = checkStageIntegrity(p.id);
      let stageNote = null;
      let newStage = p.stage;
      if (integrity.violation && p.stage !== "A3" && p.stage?.startsWith("C")) {
        newStage = "A3";
        stageNote = `stage corrected from ${p.stage} back to A3 — jumped to ${integrity.violation.atStage} with only ${integrity.violation.confirmedCount} of 5+ markers and ${integrity.violation.exchangeCount} of 20+ exchanges. Marker data collected after that point may be unreliable — a paid re-scan is recommended to properly re-derive it.`;
      }

      results.push({ name: p.name, before, after, stageNote });
      return { ...p, stage: newStage, caseFile: merged };
    }));
    setRepairResult(results);
  }

  function exportAllData() {
    const data = {
      exportedAt: new Date().toISOString(),
      prospects: prospects.map(p => {
        let chat = [];
        try { chat = JSON.parse(localStorage.getItem("chat-" + p.id) || "[]"); } catch {}
        return { ...p, chat };
      }),
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "the-filter-export-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  return (
    <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, display: "flex", flexDirection: "column", background: "#0a0a0c" }}>
      <div style={{ padding: "16px", borderBottom: "1px solid #141416", display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0, background: "#0a0a0c", zIndex: 10 }}>
        <div>
          <div style={{ fontSize: "10px", color: "#444", letterSpacing: "0.1em", textTransform: "uppercase" }}>⚡ The Filter</div>
          <div style={{ fontSize: "18px", fontWeight: "700", marginTop: "2px" }}>Prospects</div>
        </div>
        <div style={{ display: "flex", gap: "8px" }}>
          {prospects.length > 0 && <button onClick={exportAllData} style={{ background: "none", border: "1px solid #222", borderRadius: "8px", padding: "8px 14px", color: "#888", fontSize: "13px", fontWeight: "600", cursor: "pointer" }}>Export</button>}
          {prospects.length > 0 && <button onClick={repairAllMarkerData} style={{ background: "none", border: "1px solid #222", borderRadius: "8px", padding: "8px 14px", color: "#888", fontSize: "13px", fontWeight: "600", cursor: "pointer" }}>Repair markers</button>}
          {prospects.length > 0 && <button onClick={auditTopicCoverage} style={{ background: "none", border: "1px solid #222", borderRadius: "8px", padding: "8px 14px", color: "#888", fontSize: "13px", fontWeight: "600", cursor: "pointer" }}>Topic audit</button>}
          <button onClick={() => setShowNew(true)} style={{ background: "#C0392B", border: "none", borderRadius: "8px", padding: "8px 16px", color: "#fff", fontSize: "13px", fontWeight: "600", cursor: "pointer" }}>+ Add</button>
        </div>
      </div>

      <div style={{ padding: "16px", flex: 1, overflowY: "auto" }}>
        {repairResult && (
          <div style={{ background: "#0d1a0d", border: "1px solid #1a3a1a", borderRadius: "10px", padding: "12px 14px", marginBottom: "14px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "8px" }}>
              <div style={{ fontSize: "11px", color: "#7ab87a", fontWeight: "700", letterSpacing: "0.05em", textTransform: "uppercase" }}>Repair complete</div>
              <button onClick={() => setRepairResult(null)} style={{ background: "none", border: "none", color: "#4a8a4a", cursor: "pointer", fontSize: "16px" }}>✕</button>
            </div>
            {repairResult.filter(r => r.after !== r.before || r.stageNote).length === 0 ? (
              <div style={{ fontSize: "12px", color: "#7ab87a" }}>Nothing needed fixing — every prospect's markers and stage already matched their chat history.</div>
            ) : repairResult.map((r, i) => (r.after !== r.before || r.stageNote) ? (
              <div key={i} style={{ marginBottom: "6px" }}>
                {r.after !== r.before && <div style={{ fontSize: "12px", color: "#aad8aa", lineHeight: "1.8" }}>{r.name}: {r.before} → {r.after} markers restored</div>}
                {r.stageNote && <div style={{ fontSize: "12px", color: "#d0a878", lineHeight: "1.6" }}>⚠ {r.name}: {r.stageNote}</div>}
              </div>
            ) : null)}
          </div>
        )}
        {topicAuditResult && (
          <div style={{ background: "#1a1508", border: "1px solid #3a2f1a", borderRadius: "10px", padding: "12px 14px", marginBottom: "14px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "8px" }}>
              <div style={{ fontSize: "11px", color: "#d0a878", fontWeight: "700", letterSpacing: "0.05em", textTransform: "uppercase" }}>Topic audit</div>
              <button onClick={() => setTopicAuditResult(null)} style={{ background: "none", border: "none", color: "#8a6a3a", cursor: "pointer", fontSize: "16px" }}>✕</button>
            </div>
            {topicAuditResult.length === 0 ? (
              <div style={{ fontSize: "12px", color: "#d0a878" }}>No C-stage prospects yet — this only applies once someone's past the number close.</div>
            ) : topicAuditResult.every(r => r.staleTopics.length === 0) ? (
              <div style={{ fontSize: "12px", color: "#d0a878" }}>Nothing untouched — every C-stage prospect has at least some evidence on every topic from an earlier stage than where they currently sit.</div>
            ) : topicAuditResult.map((r, i) => r.staleTopics.length > 0 ? (
              <div key={i} style={{ marginBottom: "6px", fontSize: "12px", color: "#e0c090", lineHeight: "1.6" }}>
                ⚠ {r.name} ({r.stage}): {r.staleTopics.map(t => t.topic).join(", ")} never touched
              </div>
            ) : null)}
          </div>
        )}
        {prospects.length === 0 ? (
          <div style={{ textAlign: "center", paddingTop: "80px", color: "#333" }}>
            <div style={{ fontSize: "48px", marginBottom: "16px" }}>👤</div>
            <div style={{ fontSize: "15px", color: "#555", marginBottom: "6px" }}>No prospects yet</div>
            <div style={{ fontSize: "12px", color: "#333" }}>Add one to start</div>
          </div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
            {prospects.map(p => {
              const color = sc(p.stage);
              const chatLen = (() => { try { return JSON.parse(localStorage.getItem("chat-" + p.id) || "[]").length; } catch { return 0; } })();
              return (
                <div key={p.id} style={{ background: "#111113", border: "1px solid #1a1a1d", borderRadius: "12px", padding: "14px 16px", display: "flex", alignItems: "center", gap: "12px" }}>
                  <button onClick={() => setSelected(p.id)} style={{ display: "flex", alignItems: "center", gap: "12px", flex: 1, background: "none", border: "none", cursor: "pointer", textAlign: "left" }}>
                    <div style={{ width: "44px", height: "44px", borderRadius: "50%", background: color + "22", border: "2px solid " + color + "55", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "18px", fontWeight: "700", color, flexShrink: 0 }}>{p.name[0].toUpperCase()}</div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontWeight: "600", fontSize: "15px", color: "#e8e6e1" }}>{p.name}</div>
                      <div style={{ fontSize: "11px", color: "#444", marginTop: "2px" }}>{[p.age, p.platform].filter(Boolean).join(" · ")}{chatLen > 0 ? " · " + Math.floor(chatLen/2) + " exchanges" : ""}</div>
                    </div>
                    <div style={{ background: color, borderRadius: "4px", padding: "3px 8px", fontSize: "10px", fontWeight: "700", color: "#fff" }}>{p.stage||"A1"}</div>
                  </button>
                  <button onClick={() => removeProspect(p.id)} style={{ background: "none", border: "none", color: "#333", cursor: "pointer", fontSize: "16px", padding: "4px" }}>✕</button>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {showNew && <NewSheet onSave={addProspect} onClose={() => setShowNew(false)} />}
    </div>
  );
}

ReactDOM.render(React.createElement(ErrorBoundary, null, React.createElement(App)), document.getElementById('root'));
</script>
</body>
</html>
